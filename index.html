<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Trazos de Arquitecto</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@600;800&display=swap">
<style>
/* Layout: one-screen app. A drafting-table frame around one living street; the child builds each lot in place while the camera walks the city. */
:root{
  --table:#2C4766; --table-2:#233a55; --paper:#FFF8E7; --ink:#1F2E44; --muted:#6B7F96;
  --lane:#FFF3D6; --go:#2E9E62; --brick:#E0603E; --sun:#F5B22A; --teal:#2A9D9B; --plum:#8C5BB0; --blue:#4A84C4;
  --win:#FFE9A6; --sky:#A9D8EE; --sky-2:#E3F3FA; --grass:#7CC47F; --road:#56606E; --walk:#C9CDD3; --water:#5EC3E8;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Andika","Comic Sans MS",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{
  background:var(--table); color:var(--paper); font-family:var(--body); font-size:16px;
  overflow:hidden; box-sizing:border-box; padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
button{font:inherit; color:inherit; cursor:pointer; -webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--sun); outline-offset:2px}
#app{height:100%; display:grid; grid-template-rows:auto auto 1fr; gap:8px; position:relative}

header{display:flex; align-items:center; gap:12px; flex-wrap:wrap}
.brand{font-family:var(--display); font-weight:800; font-size:1.35rem; line-height:1; letter-spacing:.01em; margin-right:auto}
.brand small{display:block; font-family:var(--body); font-weight:400; font-size:.75rem; color:#B9C7D8; letter-spacing:.08em; text-transform:uppercase; margin-top:3px}
.count{display:flex; align-items:center; gap:6px; font-family:var(--display); font-weight:800; font-size:1.2rem; font-variant-numeric:tabular-nums; min-width:3em}
.count i{width:22px; height:14px; border-radius:3px; background:var(--brick); box-shadow:inset 0 -3px 0 rgba(0,0,0,.18); display:inline-block}
.count svg{width:24px; height:24px}
.count.pop{animation:pop .45s}
@keyframes pop{40%{transform:scale(1.35)}}
.iconbtn{width:44px; height:44px; border-radius:12px; border:0; background:var(--table-2); display:grid; place-items:center}
.iconbtn svg{width:24px; height:24px}
.iconbtn[aria-pressed="false"]{opacity:.55}

.msg{display:flex; align-items:center; gap:10px; min-height:44px}
.msg .tag{font-family:var(--display); font-weight:800; font-size:1.25rem; color:var(--sun); white-space:nowrap}
.msg .txt{font-size:1.05rem; color:#E7EEF6; min-width:0}

.stageWrap{position:relative; min-height:0; border-radius:22px; overflow:hidden; box-shadow:0 10px 0 rgba(0,0,0,.18); background:var(--sky)}
#stage{display:block; width:100%; height:100%; touch-action:none}

.overlay{position:absolute; inset:0; z-index:20; display:grid; place-items:center; background:rgba(28,44,64,.72); padding:16px; animation:fadein .25s}
@keyframes fadein{from{opacity:0}}
.card{background:var(--paper); color:var(--ink); border-radius:24px; padding:24px; width:min(560px,100%); max-height:100%; overflow:auto; display:grid; gap:14px; box-shadow:0 12px 0 rgba(0,0,0,.2)}
.card h1,.card h2{font-family:var(--display); font-weight:800; margin:0; line-height:1.05; text-wrap:balance}
.card h1{font-size:clamp(2rem,7vmin,3rem)}
.card h2{font-size:1.6rem}
.card p{margin:0; line-height:1.5; max-width:62ch}
.big-btn{border:0; border-radius:18px; padding:16px 28px; font-family:var(--display); font-weight:800; font-size:1.5rem; background:var(--go); color:#fff; box-shadow:0 6px 0 #1f7246; justify-self:start}
.big-btn:active{transform:translateY(4px); box-shadow:0 2px 0 #1f7246}
.big-btn.alt{background:var(--table); box-shadow:0 6px 0 #18293d}
.row{display:flex; gap:12px; flex-wrap:wrap; align-items:center}
.langBtn[aria-pressed="true"]{background:var(--go); color:#fff; border-color:var(--go)}
.kids{display:flex; flex-wrap:wrap; gap:10px; margin-top:8px}
.kid{display:flex; align-items:center; gap:10px; border:3px solid #E5D7B3; background:#fff; color:var(--ink); border-radius:18px; padding:8px 14px 8px 8px; font-family:var(--display); font-weight:800; font-size:1.15rem}
.kid[aria-pressed="true"]{border-color:var(--go); box-shadow:0 0 0 3px rgba(46,158,98,.25)}
.kid .av{width:40px; height:40px; border-radius:12px; display:grid; place-items:center; color:#fff; font-size:1.4rem; box-shadow:inset 0 -4px 0 rgba(0,0,0,.18)}
.kid small{display:block; font-family:var(--body); font-weight:400; font-size:.8rem; color:var(--muted)}
.kid.add{border-style:dashed; padding:8px 16px; color:var(--muted)}
.small-btn{border:2px solid #D8CBA8; background:transparent; color:var(--ink); border-radius:12px; padding:8px 14px; font-size:.95rem}
.small-btn.danger{border-color:var(--brick); color:#B23E22}
.label{font-size:.75rem; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
.skills{display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:8px}
.skill{border-radius:12px; background:#F3E9CF; padding:10px 12px}
.skill b{display:block; font-family:var(--display); font-size:1.4rem; font-variant-numeric:tabular-nums}
.pieces{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:6px}
.piece{text-align:left; border:0; background:#F3E9CF; border-radius:10px; padding:8px 10px; font-size:.9rem; color:var(--ink)}
.piece .k{color:var(--muted); font-size:.75rem; display:block}
.piece.done{background:#DCEFD9}
.piece.cur{outline:3px solid var(--sun)}
input[type=text],select{font:inherit; padding:8px 10px; border-radius:10px; border:2px solid #D8CBA8; background:#fff; color:var(--ink); min-width:0}
@media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}
</style>

<div id="app">
  <header>
    <div class="brand">Trazos de Arquitecto<small id="who">Mi ciudad</small></div>
    <div class="count" id="houses" aria-label="Edificios"><svg viewBox="0 0 24 24"><path d="M3 21V10l6-4v4l6-4v15z" fill="#F5B22A"/><rect x="16" y="3" width="5" height="18" fill="#E0603E"/></svg><span id="houseN">0</span></div>
    <div class="count" id="bricks" aria-label="Ladrillos"><i></i><span id="brickN">0</span></div>
    <button class="iconbtn" id="btnMap" aria-pressed="false" aria-label="Ver mapa de la ciudad">
      <svg viewBox="0 0 24 24" fill="none" stroke="#FFF8E7" stroke-width="2.2" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5" opacity=".6"/><rect x="10" y="5" width="4" height="4" fill="#F5B22A" stroke="none"/></svg>
    </button>
    <button class="iconbtn" id="btnSay" aria-label="Repetir instrucción">
      <svg viewBox="0 0 24 24" fill="none" stroke="#FFF8E7" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10v4h4l5 4V6L8 10z"/><path d="M16 9a4 4 0 0 1 0 6"/></svg>
    </button>
    <button class="iconbtn" id="btnSound" aria-pressed="true" aria-label="Sonido">
      <svg viewBox="0 0 24 24" fill="none" stroke="#FFF8E7" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></svg>
    </button>
    <button class="iconbtn" id="btnAdult" aria-label="Para adultos">
      <svg viewBox="0 0 24 24" fill="none" stroke="#FFF8E7" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>
    </button>
  </header>
  <div class="msg"><span class="tag" id="pieceName">La torre</span><span class="txt" id="msgTxt">Empieza en el punto verde.</span></div>
  <div class="stageWrap" id="stageWrap"><canvas id="stage"></canvas></div>

  <div class="overlay" id="startOv">
    <div class="card">
      <span class="label" data-t="startLbl">Obra en construcción</span>
      <h1>Trazos de Arquitecto</h1>
      <p data-t="startP"></p>
      <div><span class="label" id="whoL">¿Quién construye hoy?</span><div class="kids" id="kids"></div></div>
      <div class="row langRow"><button class="small-btn langBtn" data-l="es" aria-pressed="true">Español</button><button class="small-btn langBtn" data-l="en" aria-pressed="false">English</button></div>
      <button class="big-btn" id="btnStart" data-t="btnStart">¡A construir!</button>
    </div>
  </div>
  <div class="overlay" id="restOv" hidden>
    <div class="card">
      <span class="label" id="restLbl">Barrio terminado</span>
      <h1 id="restH">¡Barrio terminado!</h1>
      <div id="restStars" style="font-size:2.4rem;letter-spacing:.15em;color:var(--sun);line-height:1"></div>
      <p id="restTxt">Construiste muchos edificios.</p>
      <p data-t="restP"></p>
      <div class="row">
        <button class="big-btn" id="btnDone" data-t="btnDone">Terminar por hoy</button>
        <button class="big-btn alt" id="btnMore">Empezar el siguiente</button>
      </div>
    </div>
  </div>
  <div class="overlay" id="adultOv" hidden>
    <div class="card">
      <div class="row" style="justify-content:space-between"><h2 data-t="adultH">Para adultos</h2><button class="small-btn" id="btnClose" data-t="btnClose">Cerrar</button></div>
      <p data-t="adultP"></p>
      <div><span class="label" data-t="skillsL">Trazos practicados</span><div class="skills" id="skills"></div></div>
      <div class="row">
        <label for="kidName" class="label" data-t="nameL">Nombre</label><input type="text" id="kidName" placeholder="Nombre del arquitecto" maxlength="20">
        <label for="barrioSize" class="label" data-t="sizeL">Tamaño del barrio</label>
        <select id="barrioSize"><option value="18">18 edificios (~6 min)</option><option value="36">36 edificios (~12 min)</option><option value="54">54 edificios (~18 min)</option><option value="72">72 edificios (~24 min)</option></select>
        <label for="lang" class="label" data-t="langL">Idioma</label>
        <select id="lang"><option value="es">Español</option><option value="en">English</option></select>
      </div>
      <div><span class="label" data-t="voiceL">Voz</span> <span id="voiceInfo" style="font-size:.9rem"></span>
      </div>
      <div><span class="label" data-t="piecesL">Siguiente obra</span><div class="pieces" id="pieces"></div></div>
      <div class="row"><button class="small-btn" id="btnSwitch" data-t="switchKid">Cambiar de arquitecto</button><button class="small-btn danger" id="btnDelKid">Borrar este arquitecto</button><a class="small-btn" href="acerca.html" target="_blank" style="text-decoration:none" data-t="about">Sobre la app y el TDAH</a><button class="small-btn danger" id="btnReset">Borrar ciudad y progreso</button></div>
    </div>
  </div>
</div>

<script>
(() => {
// ---------- geometry (lot coordinates: building box 0..1, y down, ground at G) ----------
const G = .92, LW = 1.25;
const L = (x1,y1,x2,y2) => [[x1,y1],[x2,y2]];
const P = (...pts) => pts;
function arc(cx,cy,r,a0,a1,n=56){const o=[];for(let i=0;i<=n;i++){const a=(a0+(a1-a0)*i/n)*Math.PI/180;o.push([cx+r*Math.cos(a),cy+r*Math.sin(a)]);}return o;}
const cat = (...parts) => parts.flat().filter((p,i,a)=>i===0||Math.abs(p[0]-a[i-1][0])+Math.abs(p[1]-a[i-1][1])>1e-6);

const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const C = {}; ['paper','ink','muted','lane','go','brick','sun','teal','plum','blue','win','sky','sky-2','grass','road','walk','water'].forEach(k=>C[k]=css('--'+k));
function shade(hex, f){ const n = parseInt(hex.slice(1),16); const ch = s => Math.max(0,Math.min(255,Math.round(((n>>s)&255)*f))); return `rgb(${ch(16)},${ch(8)},${ch(0)})`; }

// ---------- drawing helpers in lot space ----------
let K = null; // {ctx, M, z}
const R = (x0,y0,x1,y1,fill) => { const [a,b]=K.M([x0,y0]), [c,d]=K.M([x1,y1]); K.ctx.fillStyle=fill; K.ctx.fillRect(a,b,c-a,d-b); };
const POLY = (pts,fill) => { const c=K.ctx; c.beginPath(); pts.forEach((p,i)=>{const [x,y]=K.M(p); i?c.lineTo(x,y):c.moveTo(x,y);}); c.closePath(); c.fillStyle=fill; c.fill(); };
const CIRC = (cx,cy,r,fill) => { const [x,y]=K.M([cx,cy]); K.ctx.beginPath(); K.ctx.arc(x,y,r*K.z,0,7); K.ctx.fillStyle=fill; K.ctx.fill(); };
const LINE = (pts,w,color,cap='round') => { const c=K.ctx; c.beginPath(); pts.forEach((p,i)=>{const [x,y]=K.M(p); i?c.lineTo(x,y):c.moveTo(x,y);}); c.lineWidth=w*K.z; c.strokeStyle=color; c.lineCap=cap; c.lineJoin='round'; c.stroke(); };
function WINS(x0,y0,x1,y1,cols,rows,color=C.win){ const cw=(x1-x0)/cols, rh=(y1-y0)/rows; for(let i=0;i<cols;i++)for(let j=0;j<rows;j++) R(x0+i*cw+cw*.22, y0+j*rh+rh*.2, x0+(i+1)*cw-cw*.22, y0+(j+1)*rh-rh*.25, color); }
const DOOR = (cx,w,h,color) => { R(cx-w/2,G-h,cx+w/2,G,color); CIRC(cx+w*.28,G-h*.45,.008,C.win); };

// ---------- the build list: every letter lives inside a building ----------
// art(c, t): c = main colour, t = 0..1 time for small animations
const PIECES = [
  // trazos básicos
  {id:'torre', name:'La torre', kind:'vertical', c:'brick', tip:'Baja por las paredes y haz el techo.', say:'', uses:'l · i · t · H',
   strokes:[L(.3,.14,.3,G),L(.7,.14,.7,G),L(.3,.14,.7,.14)],
   art:(c)=>{ R(.3,.14,.7,G,c); WINS(.34,.2,.66,.78,3,6); DOOR(.5,.12,.12,shade(c,.6)); LINE([[.5,.14],[.5,.03]],.012,C.ink); CIRC(.5,.03,.018,C.brick); }},
  {id:'casa', name:'La casa', kind:'diagonal', c:'teal', tip:'El techo y luego las paredes.', say:'', uses:'A · v · w · M',
   strokes:[L(.5,.16,.16,.5),L(.5,.16,.84,.5),L(.24,.5,.24,G),L(.76,.5,.76,G)],
   art:(c)=>{ R(.68,.18,.76,.4,shade(C.brick,.75)); R(.24,.5,.76,G,c); POLY([[.5,.16],[.12,.52],[.88,.52]],C.brick); DOOR(.36,.13,.24,shade(c,.55)); R(.5,.6,.68,.74,C.win); LINE([[.59,.6],[.59,.74]],.01,shade(c,.6)); }},
  {id:'pisos', name:'Edificio de pisos', kind:'horizontal', c:'plum', tip:'Cada piso hacia el lado.', say:'', uses:'E · F · t · z',
   strokes:[L(.2,.3,.8,.3),L(.2,.52,.8,.52),L(.2,.74,.8,.74)],
   art:(c)=>{ R(.2,.1,.8,G,c); R(.17,.08,.83,.12,shade(c,.7)); WINS(.22,.13,.78,.29,4,1); WINS(.22,.33,.78,.51,4,1); WINS(.22,.55,.78,.73,4,1); DOOR(.5,.14,.15,shade(c,.55)); }},
  {id:'parque', name:'El tobogán del parque', kind:'diagonal', c:'sun', tip:'La escalera y el tobogán.', say:'', uses:'x · k · N · z',
   strokes:[L(.3,.3,.3,G),L(.3,.3,.84,G)],
   art:(c)=>{ R(.06,.55,.1,G,'#8a5a3b'); CIRC(.08,.5,.1,shade(C.grass,.8)); CIRC(.13,.42,.08,C.grass); R(.22,.27,.34,.31,C.teal); for(let y=.38;y<G;y+=.09) LINE([[.3,y],[.38,y]],.01,C.ink); LINE([[.38,.31],[.38,G]],.012,C.ink); }},
  {id:'ventana', name:'Ventana redonda', kind:'círculo', c:'teal', tip:'Gira hasta cerrar.', say:'', uses:'o · a · d · g · q',
   strokes:[arc(.5,.4,.2,-60,-420)],
   art:(c)=>{ R(.16,.1,.84,G,c); CIRC(.5,.4,.2,C.win); LINE([[.5,.2],[.5,.6]],.012,shade(c,.6)); LINE([[.3,.4],[.7,.4]],.012,shade(c,.6)); WINS(.2,.66,.8,.8,4,1); DOOR(.5,.12,.1,shade(c,.55)); }},
  {id:'observatorio', name:'La cúpula', kind:'curva', c:'blue', tip:'Sube, pasa arriba y baja.', say:'', uses:'n · m · h · c',
   strokes:[arc(.5,.55,.26,180,360)],
   art:(c,t)=>{ R(.22,.55,.78,G,c); POLY(arc(.5,.55,.26,180,360),'#E7EEF6'); R(.47,.3,.55,.55,shade(c,.5)); LINE([[.51,.38],[.68,.2]],.03,C.ink,'butt'); WINS(.26,.6,.74,.76,4,1); DOOR(.5,.12,.13,shade(c,.55)); for(let i=0;i<3;i++){ const a=t*6+i*2; CIRC(.82+.04*Math.cos(a),.12+.03*Math.sin(a),.006,C.sun); } }},
  {id:'I', letter:'I', name:'La iglesia', kind:'letra', c:'brick', tip:'Una línea hacia abajo.', say:'',
   strokes:[L(.5,.1,.5,G)],
   art:(c)=>{ R(.16,.5,.84,G,shade(c,1.15)); WINS(.2,.58,.4,.8,2,2); WINS(.6,.58,.8,.8,2,2); R(.42,.16,.58,G,c); POLY([[.4,.16],[.5,-.02],[.6,.16]],shade(c,.7)); LINE([[.5,-.02],[.5,-.09]],.01,C.ink); LINE([[.47,-.06],[.53,-.06]],.01,C.ink); CIRC(.5,.28,.035,C.sun); DOOR(.5,.1,.16,shade(c,.5)); }},
  {id:'L', letter:'L', name:'La lavandería', kind:'letra', c:'teal', tip:'Baja y hacia el lado.', say:'',
   strokes:[L(.28,.12,.28,.84),L(.28,.84,.82,.84)],
   art:(c)=>{ R(.18,.1,.4,G,c); R(.18,.62,.86,G,shade(c,1.12)); WINS(.2,.14,.38,.6,2,5); [.5,.64,.78].forEach(x=>{ CIRC(x,.74,.05,C.paper); CIRC(x,.74,.032,C.water); }); R(.44,.5,.84,.56,C.paper); }},
  {id:'T', letter:'T', name:'La torre de agua', kind:'letra', c:'blue', tip:'El poste y la línea de arriba.', say:'',
   strokes:[L(.5,.32,.5,G),L(.2,.32,.8,.32)],
   art:(c,t)=>{ LINE([[.3,.44],[.24,G]],.02,C.ink); LINE([[.7,.44],[.76,G]],.02,C.ink); R(.38,.44,.62,G,shade(c,.85)); R(.12,.16,.88,.46,c); POLY(arc(.5,.16,.38,180,360),shade(c,.8)); R(.16,.38,.84,.42,C.water); WINS(.42,.52,.58,.84,1,4); }},
  {id:'H', letter:'H', name:'El hospital', kind:'letra', c:'blue', tip:'Dos torres y el puente.', say:'',
   strokes:[L(.26,.1,.26,G),L(.74,.1,.74,G),L(.26,.48,.74,.48)],
   art:(c)=>{ R(.14,.04,.38,G,'#F4F1EA'); R(.62,.04,.86,G,'#F4F1EA'); R(.38,.43,.62,.53,shade(c,.9)); WINS(.16,.14,.36,.84,2,8,'#BFD9F2'); WINS(.64,.14,.84,.84,2,8,'#BFD9F2'); R(.46,.22,.54,.36,C.brick); R(.43,.25,.57,.33,C.brick); }},
  {id:'E', letter:'E', name:'La escuela', kind:'letra', c:'sun', tip:'Una pared y tres pisos.', say:'',
   strokes:[L(.28,.12,.28,.9),L(.28,.12,.74,.12),L(.28,.5,.68,.5),L(.28,.9,.74,.9)],
   art:(c)=>{ R(.2,.08,.8,G,c); WINS(.34,.16,.76,.46,3,3); WINS(.34,.54,.76,.78,3,2); R(.12,.2,.2,.6,C.brick); DOOR(.55,.14,.12,shade(c,.55)); LINE([[.8,.08],[.8,-.08]],.01,C.ink); POLY([[.8,-.08],[.9,-.05],[.8,-.02]],C.blue); }},
  {id:'F', letter:'F', name:'La farmacia', kind:'letra', c:'plum', tip:'Baja, arriba y en medio.', say:'',
   strokes:[L(.3,.1,.3,G),L(.3,.1,.76,.1),L(.3,.48,.68,.48)],
   art:(c)=>{ R(.2,.02,.84,G,c); WINS(.38,.16,.78,.42,3,2); R(.62,.58,.7,.74,C.go); R(.58,.62,.74,.7,C.go); DOOR(.45,.12,.16,shade(c,.55)); }},
  // mayúsculas con curvas

  run.ink.forEach(seg => { ctx.globalAlpha = .8; LINE(seg, .028, C.ink); ctx.globalAlpha = 1; });
  const idle = run.pid === null && (!run.touched || now - run.lastTouch > 3500);
  if (idle && run.prog === 0){
    const T = 2400, k = (Math.max(0, now - run.demoT0) % (T+700)) / T;
    if (k <= 1){ const q = run.pts[Math.floor(k*(N-1))]; CIRC(q[0], q[1], .032, C.sun); const [x,y] = K.M(q); ctx.strokeStyle = C.ink; ctx.lineWidth = z*.006; ctx.beginPath(); ctx.arc(x,y,z*.032,0,7); ctx.stroke(); }

}
const easeBack = t => { const c=1.7; return 1 + (c+1)*Math.pow(t-1,3) + c*Math.pow(t-1,2); };
// ---------- board-game map of the whole city ----------
const GN = 17, isRoad = i => i%4 === 0;
const isWater = (i,j) => (i>=13 && i<=15 && j>=1 && j<=3) || (i>=1 && i<=3 && j>=13 && j<=15);
const hash = (i,j) => (((i*73856093) ^ (j*19349663)) >>> 0) % 997;
// lots fill in neighbourhood rings from the centre, scattered inside each ring
const LOTS = (() => { const o = [], c = GN/2;
  for (let i=0;i<GN;i++) for (let j=0;j<GN;j++) if (!isRoad(i) && !isRoad(j) && !isWater(i,j)) o.push([i,j]);
  const blk = ([i,j]) => [Math.floor(i/4), Math.floor(j/4)];
  const key = p => { const [bi,bj] = blk(p); return Math.round(Math.hypot(bi*4+2.5-c, bj*4+2.5-c)*10)*1e6 + hash(bi,bj)*1000 + hash(...p); };

const mapCv = document.createElement('canvas'), mctx = mapCv.getContext('2d');
const mcam = {x:0, y:2, tw:80}, mcamT = {x:0, y:2, tw:80};
let mapFade = 0, mapNewAt = 0;
const isoX = (i,j) => (i-j)/2, isoY = (i,j) => (i+j)/4;
function aimMap(){
  const used = LOTS.slice(0, Math.min(LOTS.length, S.city.length+1));
  let i0=6, i1=10, j0=6, j1=10;
  used.forEach(([i,j]) => { i0=Math.min(i0,i-1); i1=Math.max(i1,i+1); j0=Math.min(j0,j-1); j1=Math.max(j1,j+1); });
  i0=Math.max(0,i0); j0=Math.max(0,j0); i1=Math.min(GN-1,i1); j1=Math.min(GN-1,j1);
  const xa = isoX(i0, j1+1), xb = isoX(i1+1, j0), ya = isoY(i0, j0), yb = isoY(i1+1, j1+1);
  mcamT.tw = Math.min(W*(W < H ? 1.4 : .94)/(xb-xa), H*.9/(yb-ya+.9));

}
function showMap(){ aimMap(); run.view = 'map'; $('btnMap').setAttribute('aria-pressed','true'); }
function hideMap(){ run.view = 'street'; $('btnMap').setAttribute('aria-pressed','false'); }
function drawMap(now){
  const c = mctx, tw = mcam.tw;
  c.setTransform(dpr,0,0,dpr,0,0);
  const S2 = (X,Y) => [W/2 + (X-mcam.x)*tw, H/2 + (Y-mcam.y)*tw];
  const T = (i,j) => S2(isoX(i,j), isoY(i,j));
  const diamond = (i,j,w=1,h=1) => { const a=T(i,j), b=T(i+w,j), d=T(i+w,j+h), e=T(i,j+h); c.beginPath(); c.moveTo(...a); c.lineTo(...b); c.lineTo(...d); c.lineTo(...e); c.closePath(); };
  // table
  const g = c.createLinearGradient(0,0,0,H); g.addColorStop(0, C['sky-2']); g.addColorStop(1, C.sky); c.fillStyle = g; c.fillRect(0,0,W,H);
  // the board: a thick cream slab with a printed edge
  const edge = .5;
  c.save(); c.translate(0, tw*.09); diamond(-edge,-edge,GN+2*edge,GN+2*edge); c.fillStyle = '#B8A57A'; c.fill(); c.restore();
  diamond(-edge,-edge,GN+2*edge,GN+2*edge); c.fillStyle = '#EFE3C6'; c.fill();
  c.lineWidth = Math.max(1, tw*.02); c.strokeStyle = '#C9B48A'; c.stroke();
  const built = new Map(); S.city.forEach((id,k) => { if (LOTS[k]) built.set(LOTS[k].join(','), k); });
  const next = LOTS[S.city.length];
  for (let s=0; s<=2*GN-2; s++) for (let i=Math.max(0,s-GN+1); i<=Math.min(GN-1,s); i++){
    const j = s-i, rd = isRoad(i) || isRoad(j);
    diamond(i,j);
    if (rd) c.fillStyle = (isRoad(i) && isRoad(j)) ? '#7A828E' : C.road;
    else if (isWater(i,j)) c.fillStyle = C.water;
    else c.fillStyle = (i+j)%2 ? C.grass : shade(C.grass,.93);
    c.fill(); c.lineWidth = 1; c.strokeStyle = 'rgba(0,0,0,.07)'; c.stroke();
    if (rd && !(isRoad(i) && isRoad(j))){
      const [a,b] = isRoad(i) ? [T(i+.5,j+.25), T(i+.5,j+.75)] : [T(i+.25,j+.5), T(i+.75,j+.5)];
      c.strokeStyle = C.win; c.lineWidth = Math.max(1, tw*.025); c.beginPath(); c.moveTo(...a); c.lineTo(...b); c.stroke();
    }
    if (isWater(i,j) && hash(i,j)%3===0){ const [x,y] = T(i+.5,j+.5); c.strokeStyle='rgba(255,255,255,.7)'; c.lineWidth=Math.max(1,tw*.02); c.beginPath(); c.arc(x, y, tw*.08, Math.PI*.1, Math.PI*.9); c.stroke(); }
  }
  // finished barrios: a golden fence around the block
  for (let b=0; b<Math.floor(S.city.length/MANZANA); b++){
    const q = LOTS[b*MANZANA]; if (!q) break; const bi = Math.floor(q[0]/4)*4+1, bj = Math.floor(q[1]/4)*4+1;
    diamond(bi+.06, bj+.06, 2.88, 2.88); c.fillStyle = 'rgba(255,200,60,.22)'; c.fill();
    c.lineWidth = Math.max(2, tw*.06); c.strokeStyle = C.sun; c.stroke();
    const [sx,sy] = T(bi+.1, bj+.1); c.fillStyle = C.sun; c.font = `800 ${tw*.4}px "Baloo 2", sans-serif`; c.textAlign='center'; c.textBaseline='middle'; c.fillText('★', sx, sy); c.textAlign='start';
  }
  // standees, back to front
  const pieces = [];
  for (let i=0;i<GN;i++) for (let j=0;j<GN;j++){
    if (isRoad(i) || isRoad(j) || isWater(i,j)) continue;
    const key = i+','+j;
    if (built.has(key)) pieces.push({i,j,k:built.get(key)});
    else if (next && next[0]===i && next[1]===j) pieces.push({i,j,next:true});
    else if (hash(i,j)%3===0) pieces.push({i,j,tree:true});
  }
  pieces.sort((a,b) => (a.i+a.j)-(b.i+b.j));
  const newest = S.city.length-1;
  pieces.forEach(pc => {
    const [cx,cy] = T(pc.i+.5, pc.j+.5);
    if (pc.tree){ const r = tw*.09; c.fillStyle='#8a5a3b'; c.fillRect(cx-r*.2, cy-r*1.6, r*.4, r*1.6); c.fillStyle = shade(C.grass,.8); c.beginPath(); c.arc(cx, cy-r*2, r*1.1, 0, 7); c.fill(); c.fillStyle = C.grass; c.beginPath(); c.arc(cx+r*.4, cy-r*2.4, r*.8, 0, 7); c.fill(); return; }
    if (pc.next){
      const p = .5 + .5*Math.sin(now/250);
      diamond(pc.i+.12, pc.j+.12, .76, .76); c.setLineDash([tw*.05, tw*.04]); c.lineWidth = Math.max(2, tw*.03); c.strokeStyle = C.sun; c.globalAlpha = .6+.4*p; c.stroke(); c.setLineDash([]); c.globalAlpha = 1;
      c.fillStyle = C.ink; c.font = `800 ${tw*.28}px "Baloo 2", sans-serif`; c.textAlign = 'center'; c.textBaseline = 'alphabetic'; c.fillText('?', cx, cy + tw*.05 - p*tw*.05); c.textAlign = 'start';
      return;
    }
    const p = byId(S.city[pc.k]); if (!p) return;
    let grow = 1;
    if (pc.k === newest && mapNewAt){ const t = (now - mapNewAt)/700; grow = t <= 0 ? 0 : Math.max(.02, easeBack(Math.min(1,t))); if (t>0 && t<1.3){ c.strokeStyle = C.sun; c.globalAlpha = Math.max(0,1-t/1.3); c.lineWidth = tw*.04; c.beginPath(); c.ellipse(cx, cy, tw*.3*(.5+t), tw*.15*(.5+t), 0, 0, 7); c.stroke(); c.globalAlpha = 1; } }
    if (grow <= 0) return;

    p.art(C[p.c], now/1000); drawTrim(p, p.strokes);
  });
  // title card in the corner, like a board game's box label
  const nm = S.name ? tx().cityN(S.name) : tx().city;
  c.font = `800 ${Math.max(16, Math.min(24, W*.04))}px "Baloo 2", sans-serif`; c.textBaseline = 'top';
  const label = `${nm} · ${barrioLabel()}`, lw = c.measureText(label).width;
  c.fillStyle = C.paper; c.fillRect(12, 12, lw+24, Math.max(16, Math.min(24, W*.04))*1.6); c.fillStyle = C.ink; c.fillText(label, 24, 16);
  c.font = `400 ${Math.max(12, Math.min(15, W*.028))}px Andika, sans-serif`;
  { const hint = run.phase === 'tour' ? tx().tapNext : tx().tapBack, hy = 16 + Math.max(16, Math.min(24, W*.04))*1.6; c.fillStyle = 'rgba(255,248,231,.85)'; c.fillRect(12, hy, c.measureText(hint).width+24, Math.max(12, Math.min(15, W*.028))*1.6); c.fillStyle = C.ink; }
  c.globalAlpha = .8;
  c.fillText(hint, 14, 18 + Math.max(16, Math.min(24, W*.04))*1.6); c.globalAlpha = 1;
}

function frame(now){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const k = .085; cam.x += (camT.x-cam.x)*k; cam.y += (camT.y-cam.y)*k; cam.z += (camT.z-cam.z)*k;
  mcam.x += (mcamT.x-mcam.x)*k; mcam.y += (mcamT.y-mcam.y)*k; mcam.tw += (mcamT.tw-mcam.tw)*k;
  mapFade += ((run.view === 'map' ? 1 : 0) - mapFade)*.14;
  if (mapFade > .985){ drawMap(now); ctx.drawImage(mapCv, 0, 0, W, H); drawParticles(); requestAnimationFrame(frame); return; }
  drawSky(now); drawGround();
  // visible lots only
  const first = Math.max(0, Math.floor((cam.x - W/(2*cam.z))/LW) - 1), last = Math.ceil((cam.x + W/(2*cam.z))/LW) + 1;
  const building = run.piece && run.phase !== 'idle' ? run.lot : -1;
  for (let lot = first; lot <= last; lot++){
    if (lot <= S.city.length) drawLotDecor(lot);
    const id = S.city[lot];
    if (lot === building && run.phase === 'trace') continue;
    if (id){
      let grow = 1;
      if (lot === building){ const t = Math.min(1, (now - run.builtAt)/650); grow = Math.max(.02, easeBack(t)); }
      drawBuilding(lot, byId(id), now, grow);
    }
  }
  if (building >= 0 && run.phase === 'trace'){ drawGuide(now); drawCrane(building); }
  else if (run.phase === 'idle' && run.piece){ K = {ctx, z:cam.z, M:q=>toScreen(run.lot,q)}; ctx.globalAlpha=.2; run.piece.art(C[run.piece.c],0); ctx.globalAlpha=1; drawCrane(run.lot); }
  drawCars(now);
  drawReveal(now);
  // street sign
  ctx.fillStyle = C.ink; ctx.font = `700 ${Math.max(13, Math.min(17, W*.03))}px Andika, sans-serif`; ctx.textBaseline = 'top';
  const nm = S.name ? tx().cityN(S.name) : tx().city;
  ctx.fillText(`${nm} · ${barrioLabel()}`, 14, 12);
  if (mapFade > .015){ drawMap(now); ctx.globalAlpha = mapFade; ctx.drawImage(mapCv, 0, 0, W, H); ctx.globalAlpha = 1; }

}
function drawReveal(now){
  const r = run.reveal; if (!r) return;
  const t = now - r.t0; if (t < 0) return;
  const a = Math.min(1, t/250) * Math.max(0, Math.min(1, (1700 - t)/300));
  if (a <= 0) return;
  const sc = .82 + .18*easeBack(Math.min(1, t/450));
  K = {ctx, z: cam.z*sc, M: q => toScreen(r.lot, [.5 + (q[0]-.5)*sc, .5 + (q[1]-.5)*sc])};
  ctx.save(); ctx.globalAlpha = a;
  const [x0,y0] = K.M([.02,.02]), [x1,y1] = K.M([.98,G]);
  ctx.fillStyle = 'rgba(255,248,231,.94)'; ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x0, y0, x1-x0, y1-y0, 24*sc); else ctx.rect(x0, y0, x1-x0, y1-y0);
  ctx.fill(); ctx.lineWidth = 6; ctx.strokeStyle = C.sun; ctx.stroke();
  r.p.strokes.forEach(st => LINE(st, .13, shade(C[r.p.c], .5)));
  r.p.strokes.forEach(st => LINE(st, .09, C[r.p.c]));

}
function drawParticles(){
  for (let i=particles.length-1;i>=0;i--){ const q = particles[i]; q.x+=q.vx; q.y+=q.vy; q.vy += .35; q.life -= .02; if (q.life<=0){ particles.splice(i,1); continue; } ctx.globalAlpha = q.life; ctx.fillStyle = q.color; ctx.fillRect(q.x, q.y, q.size, q.size*.6); }
  ctx.globalAlpha = 1;
}

// ---------- layout ----------
function fit(){
  dpr = Math.min(2, window.devicePixelRatio||1);
  const r = $('stageWrap').getBoundingClientRect(); W = Math.max(200, Math.floor(r.width)); H = Math.max(200, Math.floor(r.height));
  stage.width = W*dpr; stage.height = H*dpr; mapCv.width = W*dpr; mapCv.height = H*dpr;
  aimMap(); Object.assign(mcam, mcamT);
  if (run.phase === 'tour') aimOverview(); else aimAtLot(run.lot);
  Object.assign(cam, camT);

try { new ResizeObserver(fit).observe($('stageWrap')); } catch(e) { addEventListener('resize', fit); }

// ---------- ui ----------
function renderWho(){ $('who').textContent = S.name ? tx().whoN(S.name) : tx().who; }
function renderSound(){ $('btnSound').setAttribute('aria-pressed', String(S.sound)); }
$('brickN').textContent = S.bricks; $('houseN').textContent = S.city.length; renderWho(); renderSound();
const unlockAudio = () => { try { ac = ac || new (window.AudioContext||window.webkitAudioContext)(); ac.resume(); } catch(e) {} };

$('btnStart').onclick = () => {

  if (S.name) speak(tx().hi(S.name));
  later(()=>loadPiece(S.level || 0), S.name ? 1100 : 0);
};
$('btnMore').onclick = () => { $('restOv').hidden = true; run.session = 0; loadPiece(S.level); };
$('btnDone').onclick = () => { $('restOv').hidden = true; run.phase = 'idle'; say(tx().bye, tx().byeT); speak(tx().byeV); $('startOv').hidden = false; };
$('btnMap').onclick = () => { if (run.phase === 'tour') { goNext(); return; } if (run.view === 'map') hideMap(); else showMap(); };
$('btnSay').onclick = () => { if (run.piece) speak(run.piece.say); run.demoT0 = performance.now(); run.lastTouch = 0; run.touched = false; };
$('btnSound').onclick = () => { S.sound = !S.sound; save(); renderSound(); try{ if(!S.sound) speechSynthesis.cancel(); }catch(e){} };

function renderAdult(){

  pickVoice(); $('voiceInfo').textContent = voice ? `${voice.name} (${voice.lang})` : (S.lang === 'en' ? 'No English voice installed on this device.' : 'Este dispositivo no tiene voz en español instalada. Instálala en Ajustes → Accesibilidad → Contenido leído → Voces.');

  $('btnReset').textContent = tx().reset; $('btnDelKid').textContent = tx().delKid; $('btnDelKid').dataset.arm = ''; $('btnDelKid').hidden = PROF.list.length < 2; $('btnReset').dataset.arm = '';
}
$('btnAdult').onclick = () => { renderAdult(); $('adultOv').hidden = false; };
$('btnClose').onclick = () => { $('adultOv').hidden = true; };
$('pieces').onclick = e => { const b = e.target.closest('.piece'); if (!b) return; $('adultOv').hidden = true; $('restOv').hidden = true; if (!$('startOv').hidden){ $('startOv').hidden = true; unlockAudio(); } loadPiece(+b.dataset.i); };
$('lang').onchange = e => { S.lang = e.target.value; save(); applyLang(); pickVoice(); renderLang(); renderWho(); renderAdult(); renderKids();
  if (run.piece && !inLang(run.piece)) S.level = nextIndex();
  run.piece = PIECES[S.level]; $('pieceName').textContent = run.piece.name; $('msgTxt').textContent = run.piece.tip; speak(run.piece.say); };
const setLang = l => { S.lang = l; save(); applyLang(); pickVoice(); renderLang(); renderWho(); renderKids(); run.piece = PIECES[S.level] || PIECES[0]; $('pieceName').textContent = run.piece.name; $('msgTxt').textContent = run.piece.tip; document.querySelectorAll('.langBtn').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.l === l))); };
document.querySelectorAll('.langBtn').forEach(b => b.onclick = () => setLang(b.dataset.l));
$('barrioSize').onchange = e => { S.barrioSize = +e.target.value; save(); };
$('kidName').oninput = e => { S.name = e.target.value.trim(); save(); renderWho(); renderKids(); };
$('btnSwitch').onclick = () => { $('adultOv').hidden = true; $('restOv').hidden = true; clearTimers(); run.phase = 'idle'; renderKids(); $('startOv').hidden = false; };
$('btnDelKid').onclick = e => {
  const b = e.currentTarget;
  if (!b.dataset.arm){ b.dataset.arm = '1'; b.textContent = tx().delKid2; return; }
  const gone = PROF.cur; try { localStorage.removeItem(KEY+':'+gone); } catch(_) {}
  PROF.list = PROF.list.filter(k => k.id !== gone); PROF.cur = '__'; useProfile(PROF.list[0].id);
  $('adultOv').hidden = true; renderKids(); $('startOv').hidden = false;
};
$('btnReset').onclick = e => {
  const b = e.currentTarget;
  if (!b.dataset.arm){ b.dataset.arm = '1'; b.textContent = tx().reset2; return; }
  clearTimers(); S.city = []; S.bricks = 0; S.done = {}; S.level = 0; save();
  $('brickN').textContent = 0; $('houseN').textContent = 0; run.session = 0; renderAdult(); loadPiece(0);
};

applyLang(); renderLang(); renderWho();
document.querySelectorAll('.langBtn').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.l === (S.lang === 'en' ? 'en' : 'es'))));
renderKids();
$('kids').onclick = e => {
  const b = e.target.closest('.kid'); if (!b) return;
  if (b.id === 'kidAdd'){
    let nm = ''; try { nm = (prompt(tx().newName) || '').trim().slice(0,20); } catch(_) {}
    const colors = ['teal','brick','plum','blue','sun','go'], id = 'p' + Date.now().toString(36);
    PROF.list.push({id, color: colors[PROF.list.length % colors.length]}); saveIndex();
    const st = Object.assign(DEFAULTS(), {name: nm, lang: S.lang}); try { localStorage.setItem(KEY+':'+id, JSON.stringify(st)); } catch(_) {}
    useProfile(id); return;
  }

};
// opening still frame: the next lot with its crane, behind the start card
run.piece = PIECES[S.level] || PIECES[0]; run.lot = S.city.length; run.phase = 'idle';
$('pieceName').textContent = run.piece.name; $('msgTxt').textContent = run.piece.tip;
window.__trazos = {run, toScreen, cam, camT};
fit();
requestAnimationFrame(frame);
})();
